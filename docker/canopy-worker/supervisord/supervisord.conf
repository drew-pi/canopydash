# This configuration manages multiple services (Celery workers, FFmpeg processes)

[unix_http_server]
file=/run/supervisord/supervisor.sock    ; Socket file location (using /run instead of /tmp)
chown=root:root                          ; Socket ownership (root only since running as root)
chmod=0700                               ; Restrictive permissions for security

[supervisord]
; Main supervisor daemon configuration
logfile=/var/log/supervisor/supervisord.log  ; Main log file location
logfile_maxbytes=10MB                    ; Increased log size for production
logfile_backups=2                        ; Keep more log backups for debugging
loglevel=info                           ; Log level (debug, info, warn, error, critical)
pidfile=/run/supervisord/supervisord.pid ; PID file location
nodaemon=true                           ; Keep in foreground for Docker
user=root                               ; Run as root user
childlogdir=/var/log/supervisor         ; Child process log directory
minfds=1024                             ; Minimum file descriptors
minprocs=200                            ; Minimum processes
umask=022                               ; Default umask for spawned processes
identifier=supervisor                    ; Identifier for this supervisor instance
directory=/app                          ; Default directory for child processes
nocleanup=false                         ; Clean up temp files on restart
strip_ansi=false                        ; Keep ANSI escape sequences in logs
silent=false                            ; Don't suppress startup messages

[rpcinterface:supervisor]
; Required RPC interface for supervisorctl communication
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
; Configuration for supervisorctl command-line tool
serverurl=unix:///run/supervisord/supervisor.sock  ; Connect via Unix socket
prompt=canopy-supervisor                ; Custom prompt for identification
history_file=~/.sc_history             ; Command history file

[include]
; Include additional service configurations
files=/etc/supervisor/conf.d/celery.conf
files=/etc/supervisor/conf.d/ffmpeg-live.conf
files=/etc/supervisor/conf.d/ffmpeg-record.conf
